name: Pull Request Validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/_run-tests.yml
